name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Libraries Qt needs for the offscreen GUI tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # The upscaling tests skip themselves without the upscale extra,
      # which keeps the PyTorch download out of CI.
      - run: uv run pytest -q -rs
        env:
          QT_QPA_PLATFORM: offscreen
