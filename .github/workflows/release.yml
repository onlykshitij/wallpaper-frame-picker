# Builds the standalone launcher on Linux (as an AppImage), Windows and macOS
# and tests each build, including the first-launch install of the
# dependencies. The Linux AppImage is then run on several distributions, starting from bare
# containers so the launcher has to install Qt's system libraries itself.
# Pushing a v* tag publishes the builds as a GitHub release. Run it by hand
# from the Actions tab to get the builds as artifacts without a release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  UV_PYTHON_PREFERENCE: only-managed   # portable Python builds, so the launcher runs everywhere
  APPIMAGE_EXTRACT_AND_RUN: "1"        # runners and containers have no FUSE to mount AppImages

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            smoke: dist/WallpaperFramePicker-x86_64.AppImage
          - os: windows-latest
            smoke: dist/WallpaperFramePicker-windows-x86_64.exe dist/WallpaperFramePicker-cli-windows-x86_64.exe
          - os: macos-latest     # Apple Silicon
            smoke: dist/WallpaperFramePicker.app/Contents/MacOS/WallpaperFramePicker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv publishes only exact, immutable versions
      - name: Libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Build
        run: uv run --python 3.12 --with pyinstaller --with pillow python packaging/build.py
      - name: Check that the Linux build runs on any distribution
        if: runner.os == 'Linux'
        run: uv run --python 3.12 --with pyinstaller python packaging/check_bundle.py build/AppDir
      - name: Remove the root certificates github.com uses (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows adds most root certificates the first time a connection needs
          # one. Without these, the runner is like a computer that has not visited
          # GitHub yet, where Python's own certificate check rejects github.com.
          $stores = 'Cert:\LocalMachine\Root', 'Cert:\LocalMachine\AuthRoot'
          $match = 'USERTrust ECC Certification Authority|Sectigo Public Server Authentication Root E46'
          $roots = Get-ChildItem $stores | Where-Object { $_.Subject -match $match }
          $roots | ForEach-Object { "removing $($_.Subject) from $($_.PSParentPath)" }
          # a certificate in both stores goes from both at once, so the second removal finds nothing
          $roots | Remove-Item -ErrorAction SilentlyContinue
          if (Get-ChildItem $stores | Where-Object { $_.Subject -match $match }) { throw "the certificates are still there" }
          uv run --python 3.12 --no-project python -c "import urllib.request; urllib.request.urlopen('https://github.com')"
          if ($LASTEXITCODE -eq 0) { throw "Python still trusts github.com, so this is not like a fresh Windows" }
          "Python's own check now rejects github.com"
          exit 0
      - name: Test the build
        run: uv run --python 3.12 python packaging/smoke_test.py ${{ matrix.smoke }}
      - name: Test video for the distribution tests (Linux)
        if: runner.os == 'Linux'
        run: uv run --python 3.12 python -c "import sys; sys.path.insert(0, 'tests'); from conftest import make_video; make_video('dist-smoke.webm')"
      - uses: actions/upload-artifact@v7
        with:
          name: wallpaper-frame-picker-${{ runner.os }}
          path: dist/WallpaperFramePicker-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: smoke-video
          path: dist-smoke.webm

  distros:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            prepare: apt-get update && apt-get install -y ca-certificates
          - image: ubuntu:20.04
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          - image: ubuntu:24.04
            prepare: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          - image: almalinux:8     # libxcb-cursor comes from EPEL on RHEL-compatible systems
            prepare: dnf install -y epel-release ca-certificates
          - image: fedora:latest
            prepare: dnf install -y ca-certificates
          - image: archlinux:latest
            prepare: pacman -Sy --noconfirm ca-certificates
          - image: opensuse/tumbleweed
            prepare: zypper --non-interactive install ca-certificates
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Prepare
        run: ${{ matrix.prepare }}
      - uses: actions/download-artifact@v8
        with:
          name: wallpaper-frame-picker-Linux
      - uses: actions/download-artifact@v8
        with:
          name: smoke-video
      - name: Install the dependencies, analyze, export and start the app
        run: |
          set -eu
          app=./WallpaperFramePicker-x86_64.AppImage
          chmod +x "$app"
          "$app" --version
          "$app" --install-deps
          "$app" cli analyze dist-smoke.webm
          "$app" cli export dist-smoke.webm out --frames 5 230
          test "$(ls out/*.png | wc -l)" -eq 2
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 "$app" dist-smoke.webm
          code=$?
          set -e
          test "$code" -eq 124   # still running when stopped
          echo "works on ${{ matrix.image }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wallpaper-frame-picker-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Publishes to PyPI, which makes `uvx wallpaper-frame-picker` work. Off until you set
  # up a trusted publisher on PyPI and the repository variable PUBLISH_TO_PYPI=true.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [build, distros]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv publishes only exact, immutable versions
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
